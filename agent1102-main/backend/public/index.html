<body>

<div id="bg-layer" aria-hidden="true"></div>

<div id="auth-screen">
  <div class="auth-box">
    <h1>agent1102</h1>
    <p id="auth-subtitle">Sign in to your account</p>
    <!-- A real <form> with proper autocomplete values, so the browser / password manager offers to save and autofill the login -->
    <form id="auth-form" class="auth-form" autocomplete="on" novalidate>
      <input type="text" id="auth-name" name="name" autocomplete="name" placeholder="Your name" style="display:none" />
      <input type="tel" id="auth-phone" name="phone" autocomplete="tel" placeholder="Phone number (optional)" style="display:none" />
      <input type="text" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" id="auth-email" name="email" placeholder="Email" />
      <div class="pw-wrap">
        <input type="password" id="auth-password" name="password" autocomplete="current-password" placeholder="Password" />
        <button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false" title="Show password"><i class="fa-solid fa-eye"></i></button>
      </div>
      <label class="auth-stay"><input type="checkbox" id="auth-stay" checked /> <span>Stay signed in</span></label>
      <p class="auth-error" id="auth-error"></p>
      <button type="submit" class="primary" id="auth-submit">Sign In</button>
    </form>
    <div style="display:flex;align-items:center;gap:0.5rem;margin:0.25rem 0">
      <div style="flex:1;height:1px;background:var(--border)"></div>
      <span style="color:var(--text-muted);font-size:0.8rem">or</span>
      <div style="flex:1;height:1px;background:var(--border)"></div>
    </div>
    <button class="primary" id="discord-btn" style="background:#5865F2"><i class="fa-brands fa-discord"></i> Continue with Discord</button>
    <button class="primary" id="github-btn" style="background:#333"><i class="fa-brands fa-github"></i> Continue with GitHub</button>
    <button class="auth-toggle" id="auth-toggle">Don't have an account? Sign up</button>
  </div>
</div>

<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <i class="fa-solid fa-comment"></i> Chat History
      <div style="display:flex;gap:0.5rem;align-items:center">
        <button id="clear-all-btn"><i class="fa-solid fa-trash-can"></i> Clear All</button>
        <button class="icon-btn" id="close-sidebar"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
    <div id="sidebar-list"></div>
  </div>
  <div id="overlay"></div>
  <header>
    <div style="display:flex;gap:0.5rem">
      <button class="icon-btn" id="history-btn" title="Chat history"><i class="fa-solid fa-comment"></i></button>
      <button class="icon-btn" id="new-chat-btn" title="New chat"><i class="fa-solid fa-pencil"></i></button>
    </div>
    <span class="header-title" id="header-title">agent1102</span>
    <div class="header-btns" id="header-btns">
      <button class="icon-btn" id="theme-btn" title="Toggle theme"><i class="fa-solid fa-moon"></i></button>
      <button class="icon-btn" id="clear-btn" title="Clear chat"><i class="fa-solid fa-trash-can"></i></button>
      <button class="icon-btn" id="logout-btn" title="Log out"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
      <button class="icon-btn" id="profile-btn" title="Profile">
        <img id="profile-icon" src="" style="display:none;width:100%;height:100%;object-fit:cover;border-radius:8px;" />
        <span id="profile-icon-fallback"><i class="fa-solid fa-circle-user"></i></span>
      </button>
    </div>
  </header>
  <div id="chat"></div>
  <div id="input-area">
    <div id="preview-area">
      <div id="attach-list"></div>
    </div>
    <div id="bottom-row">
      <button class="tool-btn" id="upload-btn" title="Attach photos, PDFs, Word/PowerPoint files, text/code, or a zip"><i class="fa-solid fa-paperclip"></i></button>
      <input type="file" id="file-input" accept="image/*,.heic,.heif,.pdf,.docx,.pptx,.zip,text/*" multiple style="display:none" />
      <button class="tool-btn" id="mic-btn" title="Voice input"><i class="fa-solid fa-microphone"></i></button>
      <textarea id="input" placeholder="Type a message..."></textarea>
      <button id="send">Send</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="profile-modal">
  <div class="modal-box">
    <h2 style="font-size:1.2rem;font-weight:600"><i class="fa-solid fa-circle-user"></i> Profile Settings</h2>
    
   <div id="profile-upload-section" class="agent1102-glass-panel" style="width: 100%; text-align: center; box-sizing: border-box;">
      <img id="profile-preview" src="" alt="Profile" width="100" height="100" style="display: block; margin: 0 auto 15px auto; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.4); background: var(--surface2);" />
      
      <label for="avatar-upload" class="glass-btn">Update Photo</label>
      <input type="file" id="avatar-upload" accept="image/jpeg, image/png, image/webp" style="display:none;" />
    </div>
    <input type="text" id="profile-name" class="modal-input" placeholder="New name" />
    <input type="text" inputmode="email" autocomplete="email" autocapitalize="off" spellcheck="false" id="profile-email" class="modal-input" placeholder="New email" />
    <div class="pw-wrap">
      <input type="password" id="profile-password" class="modal-input" autocomplete="new-password" placeholder="New password" />
      <button type="button" class="pw-toggle" aria-label="Show password" aria-pressed="false" title="Show password"><i class="fa-solid fa-eye"></i></button>
    </div>
    <p id="profile-msg" style="font-size:0.85rem;text-align:center;color:var(--text-muted)"></p>
    <div style="display:flex;gap:0.5rem">
      <button id="profile-save" class="modal-btn" style="flex:1;background:var(--accent);color:white"><i class="fa-solid fa-floppy-disk"></i> Save</button>
      <button id="profile-close" class="modal-btn" style="flex:1;background:var(--surface2);color:var(--text);border:1px solid var(--border)"><i class="fa-solid fa-ban"></i> Cancel</button>
    </div>
    <button id="profile-delete" class="modal-btn" style="width:100%;background:#c0392b;color:white"><i class="fa-solid fa-trash-can"></i> Delete Account</button>
  </div>
</div>
