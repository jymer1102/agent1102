<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>T-Rex</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js"></script>
    <link rel="icon" type="image/png" href="./assets/default_100_percent/100-error-offline.png">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #f7f7f7; /* same as the game's own background */
        }

        /* index.js flips html/body to #202124 when night mode (body.inverted)
           kicks in; this just smooths the change. */
        html, body { transition: background-color 1s ease; }

        body {
            display: flex;
            align-items: center;      /* vertical centre */
            justify-content: center;  /* horizontal centre */
        }

        /* index.css pads the wrapper by 100px for Chrome's offline page; the
           game should sit dead centre instead. */
        .offline .interstitial-wrapper,
        #main-frame-error {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            padding: 0 !important;
        }

        /* index.js adds a full-screen "touch controller" layer on phones, and
           index.css gives it a 10% white tint. That tint is what made the game
           area lighter than the page in dark mode. Make it invisible, and pin
           it to the screen so it never lands on a random patch of the page. */
        .offline .controller,
        .controller {
            background: transparent !important;
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            z-index: 1;
        }

        /* the static dino icon is only a placeholder; don't let it take space */
        .icon-offline { display: none !important; }
        #main-content { display: none; }

        /* Full width, no transform: a transform would trap the canvas under the
           full-screen touch layer on phones, so taps never reached it. */
        .offline .runner-container,
        .runner-container {
            position: relative !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            max-width: 600px;
            height: 150px;
            margin: 0 auto;
            z-index: 2;
        }
    </style>
</head>
<body id="t" class="offline">

    <div id="main-frame-error" class="interstitial-wrapper">
        <div id="main-content">
            <div class="icon icon-offline" alt=""></div>
            <button id="details-button" style="display:none;"></button>
        </div>
        <div id="offline-resources">
            <img id="offline-resources-1x" src="assets/default_100_percent/100-offline-sprite.png">
            <img id="offline-resources-2x" src="assets/default_200_percent/200-offline-sprite.png">
        </div>
    </div>

</body>
</html>
