# Runs the linter and every test suite on each push and pull request, so a mistake is caught before it is deployed.
# (The app lives in the agent1102-main/ folder of this repo, so every step runs from agent1102-main/backend.)
name: Tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent1102-main/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm test
