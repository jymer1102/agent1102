# Runs the linter and every test suite on pushes to main and on pull requests, so a mistake is caught before it is deployed.
name: Tests

on:
  push:
    branches: [main]
    paths-ignore:        # commits that only touch notes/docs can't break anything
      - "**.md"
      - "**.txt"
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.txt"

# A newer push cancels the older run for the same branch, so quick back-to-back commits don't pile up failures
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm test
